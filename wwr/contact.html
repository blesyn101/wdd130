<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Whitewater Rafting Company</title>
    <meta name="description"
      content="This is how you can contact us at WhiteWater Rafting Company ">
    <meta name="author" content="Iyonawan Blessing Agharese">
    <link rel="stylesheet" href="styles/contact.css">
</head>

<body>
    <header>
        <img src="images/rafting-logo.png" alt="raftting-logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="contact-main">

        <!-- Company info -->
        <section class="company-details">
            <h1>White Water Rafting Company </h1>
            <p>205 Rapid River Way, Benin City,
                <br>Nigeria ID 83467
                <br>+234 812 999 1110
                <br>info@whitewaterrafting.com
            </p>
        </section>


        <div class="map-form-wrap">
            <section class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d507580.5898747275!2d5.282614160666847!3d6.332667680074789!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1040d36279cfacf1%3A0x84aa10c05758dfa0!2sBenin%20City%2C%20Edo!5e0!3m2!1sen!2sng!4v1786167048979!5m2!1sen!2sng"
                  style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </section>


            <section class="contact-form-section">
                <form action="#" method="post" class="contact-form">
                    <div class="form-group">
                        <label for="fullname">Name:</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <fieldset class="radio-group">
                        <legend>Message Purpose:</legend>
                        <label>
                            <input type="radio" name="purpose" value="general" checked> General
                            Inquiry
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="reservation"> Reservation
                            Question
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="suggestion"> Website
                            Suggestion
                        </label>
                    </fieldset>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="3" required></textarea>

                    <label class="checkbox-label">
                        <input type="checkbox" name="newsletter" value="subscribe"> Please subscribe
                        me to the monthly newsletter
                    </label>

                    <button type="submit" class="submit-btn">Get in Touch!</button>
                </form>
            </section>
        </div>

        <section class="employee-profiles">
            <h2>We Are Here to Serve You</h2>
            <div class="profile-cards">
                <figure>
                    <img src="images/employee1.jpg" alt="Jane Doe - Lead River Guide">
                    <figcaption><strong>Jane Doe</strong><br>Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="John Smith - Operations Manager">
                    <figcaption><strong>John Smith</strong><br>Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Alex Johnson - Safety Director">
                    <figcaption><strong>Alex Johnson</strong><br>Safety Director</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Whitewater Rafting | Iyonawan Blessing Agharese</p>
        <nav class="socialmedia">
            <a href="https://www.instagram.com/blessingagharese_/">
                <img src="images/instagram.svg" alt="instagram icon">
            </a>
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="facebook icon">
            </a>
            <a href="https://www.linkedin.com/in/blessing-agharese/">
                <img src="images/linkedin.svg" alt="linkedIn icon">
            </a>
        </nav>
    </footer>
</body>

</html>
